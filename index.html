<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mirchi 360 Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family:Poppins;
    margin:0;
    display:flex;
    background:#111;
    color:white;
}

/* ADMIN */
.admin{https://ibb.co/fdTXpt0w
    width:35%;
    padding:20px;
    background:#1c1c1c;
}

input{
    width:100%;
    padding:10px;
    margin:5px 0;
}

button{https://ibb.co/kgDJJ0kJ
    padding:10px;
    width:100%;
    background:#ff2b85;
    border:none;
    color:white;
    cursor:pointer;
}

/* LIVE SITE */
.site{
    width:65%;
    padding:20px;
    background:#f5f5f5;
    color:black;
}

header{
    background:#ff2b85;
    color:white;
    padding:10px;
    text-align:center;
}

/* MENU */
.cardhttps://ibb.co/jc554rv{
    background:white;
    margin:10px 0;
    padding:10px;
    display:flex;
    border-radius:10px;
    align-items:center;
}

.card img{https://ibb.co/kgDJJ0kJ
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:10px;
    margin-right:10px;
}
</style>
</head>

<body>

<!-- ADMIN PANEL -->
<div class="admin">
<h2>🛠 Admin Panel</h2>

<h4>Logo Name</hhttps://ibb.co/tTnz8J8y4>
<input id="logoText" placeholder="Mirchi 360">
<button onclick="updateLogo()">Update Logo</button>

<hr>

<h4>Add Menu Item</h4>
<input id="name" placeholder="Food Name">
<input id="price" placeholder="Price">
<input id="img" placeholder="Image URL">
<button onclick="addItem()">Add Item</button>
</div>

<!-- LIVE SITE -->
<div class="site">

<header>
<h2 id="logo">Mirchi 360</h2>
</header>

<h3>🍽 Menu</h3>
<div id="menu"></div>

</div>

<script>
let menu = JSON.parse(localStorage.getItem("menu")) || [];

function addItem(){
    let item = {
        name: document.getElementById("name").value,
        price: document.getElementById("price").value,
        img: document.getElementById("img").value
    };

    menu.push(item);
    localStorage.setItem("menu", JSON.stringify(menu));
    render();
}

function render(){
    let html = "";

    menu.forEach(item=>{
        html += `
        <div class="card">
            <img src="${item.img}">
            <div>
                <h4>${item.name}</h4>
                <p>Rs ${item.price}</p>
            </div>
        </div>
        `;
    });

    document.getElementById("menu").innerHTML = html;
}

function updateLogo(){
    let text = document.getElementById("logoText").value;
    document.getElementById("logo").innerText = text;
    localStorage.setItem("logo", text);
}

/* LOAD */
window.onload = ()=>{
    document.getElementById("logo").innerText = localStorage.getItem("logo") || "Mirchi 360";
    render();
};
</script>

</body>
</html>
